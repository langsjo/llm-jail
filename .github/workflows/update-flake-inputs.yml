name: Update flake inputs

on:
  schedule:
    - cron: "41 5 * * *"
      timezone: Europe/Helsinki
  workflow_dispatch:

concurrency:
  group: update-flake-inputs
  cancel-in-progress: true

env:
  BRANCH: auto-update-flake-inputs

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      # Ubuntu's AppArmor strips capabilities from unprivileged user
      # namespaces, which virtiofsd --sandbox=namespace needs
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Configure attic
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix profile add --impure --expr \
            "(builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.$(uname -m)-linux.attic-client"
          attic login main https://cache.langsjo.dev "$ATTIC_TOKEN"
          attic use main

      - name: Update flake inputs
        id: update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"

          inputs=(nixpkgs-rolling llm-agents)
          # The guest's base nixpkgs only moves weekly, on Sundays
          if [ "$(date -u +%u)" = 7 ]; then
            inputs+=(nixpkgs)
          fi

          nix flake update "${inputs[@]}" \
            --commit-lock-file \
            --option commit-lockfile-summary 'flake: update inputs'

          if git diff --quiet "origin/$GITHUB_REF_NAME"; then
            echo "update_available=false" >> "$GITHUB_OUTPUT"
          else
            echo "update_available=true" >> "$GITHUB_OUTPUT"
          fi

      # Must run before the checks: anything they build locally would no longer
      # count as missing, and so would never be pushed to the cache
      - name: Build uncached derivations
        if: steps.update.outputs.update_available == 'true'
        run: |
          nix eval .#packages.x86_64-linux --apply builtins.attrNames --json \
            | jq -r '.[] | ".#packages.x86_64-linux.\(.)"' > /tmp/packages.txt
          mapfile -t packages < /tmp/packages.txt

          nix run github:langsjo/nix-build-substitutable \
            -- --skip-prefer-local --skip-shell-applications "${packages[@]}" \
            -- --print-build-logs > /tmp/out_paths.txt

      - name: Run flake checks
        if: steps.update.outputs.update_available == 'true'
        run: nix flake check --print-build-logs

      - name: Build packages
        if: steps.update.outputs.update_available == 'true'
        run: |
          mapfile -t packages < /tmp/packages.txt
          nix build "${packages[@]}" --no-link --print-build-logs

      - name: Push to cache
        if: steps.update.outputs.update_available == 'true'
        run: |
          if [ -s /tmp/out_paths.txt ]; then
            attic push main --stdin < /tmp/out_paths.txt
          fi

      - name: Create and merge pull request
        if: steps.update.outputs.update_available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push --force --set-upstream origin "$BRANCH"
          gh pr create --base "$GITHUB_REF_NAME" --head "$BRANCH" --fill
          gh pr merge "$BRANCH" --squash --delete-branch
